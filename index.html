<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Recipes" />
  <title>Recipe Finder</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <section class="ingredients-panel">
      <div class="search-row">
        <input
          type="search"
          id="ingredient-search"
          class="search-input"
          placeholder="search ingredients"
          autocomplete="off"
          autocorrect="off"
          autocapitalize="off"
          spellcheck="false"
        />
        <button id="clear-selected" class="clear-btn" type="button" aria-label="Clear selected ingredients">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
            <path d="M6 6L18 18M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
          </svg>
        </button>
      </div>
      <ul id="ingredient-list" class="ingredient-list"></ul>
    </section>

    <section class="results-panel">
      <div id="results-cards" class="results-cards"></div>
      <div id="results-chips" class="results-chips"></div>
    </section>
  </div>

  <div id="modal-overlay" class="modal-overlay" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <button id="modal-close" class="modal-close" type="button" aria-label="Close">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
          <path d="M6 6L18 18M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
        </svg>
      </button>
      <img id="modal-photo" class="modal-photo" alt="" />
      <h2 id="modal-title" class="modal-title"></h2>
      <ul id="modal-ingredients" class="modal-ingredients"></ul>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
